name: build-release

# Compila Swip en Windows y publica/actualiza un release "latest" con el zip listo para usar.
# Así puedes actualizar la app con update.ps1 sin volver a descargar el repo.

on:
  push:
    branches:
      - claude/quick-user-switcher-app-w747wk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pruebas
        run: dotnet test tests/Swip.Tests/Swip.Tests.csproj -c Release

      - name: Publicar servicio
        run: dotnet publish src/Swip.Service/Swip.Service.csproj -c Release -r win-x64 --self-contained false -o publish/Service

      - name: Publicar app
        run: dotnet publish src/Swip.App/Swip.App.csproj -c Release -r win-x64 --self-contained false -o publish/App

      - name: Incluir scripts en el paquete
        shell: pwsh
        run: |
          Copy-Item update.ps1 publish/update.ps1 -Force
          Copy-Item setup.ps1  publish/setup.ps1  -Force

      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Swip-win-x64.zip -Force

      - name: Calcular SHA-256 del paquete
        shell: pwsh
        run: |
          # update.ps1 descarga este archivo junto al zip y se niega a instalar si no coinciden.
          $hash = (Get-FileHash Swip-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Swip-win-x64.zip" | Set-Content -Path Swip-win-x64.zip.sha256 -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Publicar release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No borramos el release (evita ventanas de 404). Lo creamos si no existe
          # y solo sobrescribimos el asset con --clobber.
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest `
              --title "Swip (latest)" `
              --notes "Compilación automática (rolling)" `
              --target ${{ github.sha }}
          }
          gh release upload latest Swip-win-x64.zip Swip-win-x64.zip.sha256 --clobber
